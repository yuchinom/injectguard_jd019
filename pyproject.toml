[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yuchinom-injectguard_jd019"
version = "0.1.0"
description = "按段落统计提示注入防护工程师·奖励模型的过拟合相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "yuchinom" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://yuchinom.github.io"
Repository = "https://github.com/yuchinom/injectguard_jd019"
Issues = "https://github.com/yuchinom/injectguard_jd019/issues"

[project.scripts]
injectguard_jd019 = "injectguard_jd019:main"

[tool.setuptools]
py-modules = ["injectguard_jd019"]
